<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Viewer · Go-pedia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf8f5;--surface:#fff;--surface-2:#f5f2ec;--border:#ece7de;
  --text:#2e2e3f;--text-soft:#5a5a70;--muted:#8e8ea0;
  --primary:#8899c4;--primary-hover:#7386b5;--primary-soft:#edf0f8;--primary-ring:#dde4f2;
  --lavender:#e0d7ee;--lav-ink:#5a4a6b;--rose-ink:#7a3a44;
  --shadow-md:0 6px 20px rgba(46,46,63,.08);
  --header-h:64px;--footer-h:56px;--stage:#3b3d41;
}
[data-theme="dark"]{
  --bg:#1c1c28;--surface:#24242f;--surface-2:#2a2a38;--border:#35353f;
  --text:#eceaf2;--text-soft:#b8b6c8;--muted:#8e8ca0;
  --primary:#98a8d0;--primary-soft:#2e3245;--lavender:#3a3248;--lav-ink:#c8b8e0;--rose-ink:#e8b8c0;
  --stage:#17171d;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;
  -webkit-font-smoothing:antialiased;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
a{color:var(--primary);text-decoration:none}
svg{width:100%;height:100%;display:block}

/* Header */
.v-header{height:var(--header-h);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:0 1rem;
  background:var(--surface);border-bottom:1px solid var(--border);z-index:20}
.v-brand{display:flex;align-items:center;gap:.6rem;min-width:0;flex:1}
.v-brand-mark{width:36px;height:36px;border-radius:10px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex-shrink:0;padding:8px}
.v-title-wrap{min-width:0;flex:1}
.v-title{font-size:.92rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.v-subtitle{font-size:.7rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-actions{display:flex;gap:.4rem;flex-shrink:0}
.btn-icon{width:36px;height:36px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;padding:9px;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text-soft);transition:.15s}
.btn-icon:hover{background:var(--primary-soft);color:var(--primary);border-color:var(--primary-ring)}
.btn-back{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem .85rem;border-radius:9px;background:var(--primary);color:#fff;font-size:.8rem;font-weight:700;transition:.15s}
.btn-back:hover{background:var(--primary-hover)}
.btn-back i{width:14px;height:14px;display:block}

/* Stage */
.v-main{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:1rem;min-height:0}
.v-stage{width:100%;height:100%;max-width:1400px;display:flex;flex-direction:column;min-height:0;position:relative}
.v-frame{flex:1;min-height:0;position:relative;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-md);overflow:hidden}
.v-frame.frame-media{background:var(--stage)}
.v-stage:fullscreen{max-width:100%;background:#000}
.v-stage:fullscreen .v-frame{border-radius:0;border:none}
.v-stage:fullscreen .wrap{background:#000}
#mediaContainer{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:auto}
.v-frame iframe{width:100%;height:100%;border:0;display:block}

/* PDF */
.wrap{position:relative;width:100%;height:100%;background:var(--stage);overflow:hidden}
.vp{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}
.vp.m-page,.vp.m-book{display:flex}
.spread{margin:auto;display:flex;gap:8px;flex:none}
.sheet{position:relative;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.45);border-radius:2px;flex:none}
.m-scroll .sheet{margin:0 auto 12px}
.sheet canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}

/* Toolbar */
.pdf-toolbar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:30;max-width:calc(100% - 16px);
  display:flex;align-items:center;gap:4px;padding:6px 10px;overflow-x:auto;scrollbar-width:none;
  background:rgba(255,255,255,.55);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--border);border-radius:999px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);transition:transform .18s ease-out,opacity .18s ease-out}
[data-theme="dark"] .pdf-toolbar{background:rgba(36,36,47,.55);backdrop-filter:blur(18px) saturate(1.4)}
.pdf-toolbar.off{transform:translateX(-50%) translateY(160%);opacity:0;pointer-events:none}
.tb{width:34px;height:34px;flex:none;padding:8px;border-radius:50%;color:var(--text);transition:background .15s}
.tb:hover:not(:disabled){background:var(--surface-2)}
.tb:disabled{opacity:.3;cursor:not-allowed}
.tb.active{background:var(--primary);color:#fff}
.tb-text{flex:none;min-width:56px;padding:0 6px;height:34px;border-radius:17px;font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums}
.tb-text:hover{background:var(--surface-2)}
.sep{width:1px;height:20px;background:var(--border);flex:none;margin:0 2px}

/* Audio / external */
.audio-card,.external-card{width:90%;max-width:500px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2.5rem 1.75rem;text-align:center;box-shadow:var(--shadow-md)}
.external-card{max-width:440px}
.audio-cover{width:120px;height:120px;margin:0 auto 1.5rem;border-radius:50%;background:linear-gradient(135deg,var(--lavender),var(--primary-soft));display:flex;align-items:center;justify-content:center;color:var(--lav-ink);padding:34px}
.audio-title,.external-card h2{font-size:1.1rem;font-weight:800;margin-bottom:.35rem;line-height:1.3}
.audio-subtitle{font-size:.8rem;color:var(--muted);margin-bottom:1.25rem}
.audio-card audio{width:100%;margin-top:.5rem}
.external-icon{width:80px;height:80px;border-radius:22px;background:var(--primary-soft);color:var(--primary);margin:0 auto 1.25rem;padding:22px}
.external-card p{font-size:.83rem;color:var(--text-soft);margin-bottom:1.5rem}
.btn-open-ext{display:flex;align-items:center;justify-content:center;padding:.7rem 1.5rem;border-radius:10px;background:var(--primary);color:#fff;font-weight:700;font-size:.85rem;transition:.15s}
.btn-open-ext:hover{background:var(--primary-hover)}

/* Loading */
.v-loading{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;z-index:15;padding:2rem;text-align:center;transition:opacity .3s}
.v-spinner{width:38px;height:38px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--primary);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.v-spinner{animation-duration:2s}.pdf-toolbar{transition:none}}
.v-loading-text{font-size:.85rem;font-weight:600;color:var(--text-soft);max-width:360px}
.v-error-text{color:var(--rose-ink)}

/* Footer */
.v-footer{height:var(--footer-h);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:0 1.5rem;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.v-author{display:flex;flex-direction:column;min-width:0}
.v-author .label{font-size:.65rem;color:var(--muted);font-weight:600;line-height:1.2}
.v-author .name{font-size:.85rem;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot-btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem .85rem;border-radius:9px;font-size:.8rem;font-weight:700;border:1px solid var(--border);background:var(--surface-2);color:var(--text-soft);transition:.15s}
.foot-btn:hover{background:var(--primary-soft);color:var(--primary);border-color:var(--primary-ring)}
.foot-btn i{width:14px;height:14px;display:block}

@media (max-width:768px){
  :root{--header-h:56px;--footer-h:52px}
  .v-main{padding:0}.v-frame{border-radius:0;border:none}
  .v-subtitle,.btn-back span,.foot-btn span{display:none}
  .btn-back{padding:.5rem}.v-footer{padding:0 1rem}
  .pdf-toolbar{bottom:10px;padding:5px 6px}.tb{width:32px;height:32px;padding:7px}.tb-text{min-width:48px;font-size:.75rem}
  .z{display:none!important}
  .audio-card,.external-card{padding:1.75rem 1.25rem}
}
</style>
</head>
<body>

<header class="v-header">
  <div class="v-brand">
    <div class="v-brand-mark" data-ic="book"></div>
    <div class="v-title-wrap">
      <div class="v-title" id="vTitle">Memuat...</div>
      <div class="v-subtitle">Go-pedia · Pustaka Media</div>
    </div>
  </div>
  <div class="v-actions">
    <button class="btn-icon" id="btnTheme" title="Ganti tema" data-ic="sun"></button>
    <button class="btn-icon" id="fullscreenBtn" title="Layar penuh (F)" data-ic="expand"></button>
    <a href="index.html" class="btn-back" title="Kembali ke katalog"><i data-ic="back"></i><span>Katalog</span></a>
  </div>
</header>

<main class="v-main">
  <div class="v-loading" id="vLoading">
    <div class="v-spinner" id="vSpinner"></div>
    <div class="v-loading-text" id="vLoadingText">Menyiapkan viewer...</div>
  </div>
  <div class="v-stage" id="vStage" hidden>
    <div class="v-frame" id="vFrame">
      <div id="mediaContainer"></div>
      <div class="pdf-toolbar off" id="pdfToolbar" role="toolbar" aria-label="Kontrol dokumen" hidden>
        <button class="tb" id="bPrev" data-ic="prev" title="Sebelumnya (←)"></button>
        <button class="tb-text" id="bPage" title="Ke halaman…">1 / 1</button>
        <button class="tb" id="bNext" data-ic="next" title="Berikutnya (→)"></button>
        <i class="sep z"></i>
        <button class="tb z" id="bZout" data-ic="minus" title="Perkecil (-)"></button>
        <button class="tb-text z" id="bZoom" title="Reset zoom (0)">100%</button>
        <button class="tb z" id="bZin" data-ic="plus" title="Perbesar (+)"></button>
        <i class="sep"></i>
        <button class="tb" id="bMode" title="Ganti mode (M)"></button>
      </div>
    </div>
  </div>
</main>

<footer class="v-footer" id="vFooter" hidden>
  <div class="v-author" id="vAuthor"></div>
  <div id="vFooterActions"></div>
</footer>

<script>
'use strict';

const API_URL = 'https://script.google.com/macros/s/AKfycbzsCStKIS9V6qFNeGqhI1jhZLXbd-AmTFsF17SOCb8Gh0RoIZv6eiGK_PsTWHNomfXU/exec';
const THEME_KEY = 'gopedia_theme';
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const YT = /(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/;
const TB_HIDE_MS = 1600;
const TB_ZONE = 90;

const $ = (s) => document.querySelector(s);
const esc = (s) => s == null ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = (u) => { const s = String(u || '').trim(); return /^https?:\/\//i.test(s) ? s : ''; };

const ICONS = {
  prev:'<path d="M15 18l-6-6 6-6"/>', next:'<path d="M9 18l6-6-6-6"/>',
  minus:'<path d="M5 12h14"/>', plus:'<path d="M12 5v14M5 12h14"/>',
  slide:'<rect x="3" y="5" width="18" height="14" rx="2"/>', scroll:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  book:'<path d="M3 5h18v14H3zM12 5v14"/>',
  back:'<path d="M19 12H5M12 19l-7-7 7-7"/>',
  sun:'<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>',
  expand:'<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>',
  shrink:'<path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  ext:'<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/>',
  music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>'
};
const ic = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
const fillIcons = (root = document) => root.querySelectorAll('[data-ic]').forEach(e => e.innerHTML = ic(e.dataset.ic));
const b64ToBytes = (b) => { const s = atob(b.replace(/\s/g, '')), a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; };

/* ==========================================================
   PDF VIEWER
   ========================================================== */
class PdfViewer {
  constructor(app, pdf, key) {
    Object.assign(this, { app, pdf, key, n: pdf.numPages, page: 1, zoom: 1, sheets: [], ratio: .75, shown: false });
  }

  async start() {
    const v = (await this.pdf.getPage(1)).getViewport({ scale: 1 });
    this.ratio = v.height / v.width;
    this.landscape = v.width > v.height;
    this.modes = this.landscape ? ['page', 'scroll'] : ['scroll', 'page', 'book'];
    this.mode = this.modes[0];
    this.page = Math.min(Math.max(+localStorage.getItem(this.key) || 1, 1), this.n);

    $('#mediaContainer').innerHTML = '<div class="wrap" id="wrap"><div class="vp" id="vp"></div></div>';
    this.wrap = $('#wrap'); this.vp = $('#vp');
    this.tb = $('#pdfToolbar'); this.tb.hidden = false;
    fillIcons(this.tb);
    this.bind(); this.mount();
    this.showTb();
  }

  /* ---------- sheet (satu halaman) ---------- */
  sheet(i) {
    const s = document.createElement('div');
    s.className = 'sheet'; s.dataset.n = i;
    s.cv = document.createElement('canvas');
    s.append(s.cv);
    this.sheets.push(s);
    return s;
  }

  spread() { const b = this.page % 2 ? this.page : this.page - 1; return b + 1 <= this.n ? [b, b + 1] : [b]; }

  mount() {
    this.io?.disconnect();
    this.sheets.forEach(s => s._task?.cancel());
    this.sheets = []; this.vp.innerHTML = '';
    this.vp.className = 'vp m-' + this.mode;
    if (this.mode === 'scroll') {
      for (let i = 1; i <= this.n; i++) this.vp.appendChild(this.sheet(i));
      this.layout();
      this.io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? this.paint(e.target) : this.release(e.target)),
        { root: this.vp, rootMargin: '100% 0px' });
      this.sheets.forEach(s => this.io.observe(s));
      requestAnimationFrame(() => this.jump(this.page, false));
    } else {
      const box = document.createElement('div'); box.className = 'spread';
      (this.mode === 'book' ? this.spread() : [this.page]).forEach(i => box.appendChild(this.sheet(i)));
      this.vp.appendChild(box);
      this.layout();
      this.sheets.forEach(s => this.paint(s));
      [this.page + 1, this.page + 2, this.page - 1].forEach(p => p >= 1 && p <= this.n && this.pdf.getPage(p));
    }
    this.ui();
  }

  layout() {
    const vw = this.vp.clientWidth, vh = this.vp.clientHeight, p = vw < 600 ? 6 : 16, g = 8, r = this.ratio;
    // Fullscreen menggunakan padding yang sama dengan atas agar tidak ada ruang kosong berlebih
    const pb = this.mode === 'scroll' ? p + 80 : (document.fullscreenElement ? p : 64);
    this.vp.style.padding = `${p}px ${p}px ${pb}px`;
    const aw = vw - 2 * p, ah = vh - p - pb;
    let w;
    if (this.mode === 'scroll') w = Math.min(aw, this.landscape ? 1280 : 900);
    else if (this.mode === 'book') w = Math.min((aw - g) / 2, ah / r);
    else w = Math.min(aw, ah / r);
    w = Math.max(w, 60) * this.zoom;
    this.sheets.forEach(s => {
      s._w = w; s.style.width = w + 'px'; s.style.height = w * r + 'px';
    });
  }

  async paint(s) {
    const px = Math.min(Math.round(s._w * Math.min(devicePixelRatio || 1, 2)), 4096);
    if (!px || s._key === px) return;
    s._key = px; s._task?.cancel();
    try {
      const pg = await this.pdf.getPage(+s.dataset.n), b = pg.getViewport({ scale: 1 });
      const vp = pg.getViewport({ scale: px / b.width });
      const c = document.createElement('canvas');
      c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
      const t = pg.render({ canvasContext: c.getContext('2d', { alpha: false }), viewport: vp });
      s._task = t; await t.promise;
      if (s._key !== px) return;
      s.replaceChild(c, s.cv); s.cv = c;
      if (!this.shown) { this.shown = true; this.app.ready(); }
    } catch (e) { if (s._key === px) s._key = 0; }
  }

  release(s) { s._task?.cancel(); s._key = 0; s.cv.width = s.cv.height = 0; }
  repaint() { this.sheets.forEach(s => { if (this.mode !== 'scroll' || s._key) this.paint(s); }); }

  /* ---------- navigasi & zoom ---------- */
  jump(n, smooth = true) {
    const s = this.sheets[n - 1];
    if (s) this.vp.scrollTo({ top: s.offsetTop - 12, behavior: smooth ? 'smooth' : 'auto' });
  }
  go(n) {
    n = Math.min(Math.max(n, 1), this.n);
    if (this.mode === 'scroll') { this.page = n; this.jump(n); return this.ui(); }
    if (this.mode === 'book' && n % 2 === 0) n--;
    if (n === this.page) return;
    this.page = n; this.zoom = 1; this.mount();
  }
  step(d) { this.go(this.page + (this.mode === 'book' ? 2 * d : d)); this.showTb(); }
  next() { this.step(1); }
  prev() { this.step(-1); }
  cycle() { this.mode = this.modes[(this.modes.indexOf(this.mode) + 1) % this.modes.length]; this.zoom = 1; this.mount(); }
  setZoom(z) {
    z = Math.min(3, Math.max(.5, Math.round(z * 4) / 4));
    if (z === this.zoom) return;
    this.zoom = z; this.layout(); this.ui();
    clearTimeout(this.zt); this.zt = setTimeout(() => this.repaint(), 150);
  }
  zoomBy(d) { this.setZoom(this.zoom + d); }
  track() {
    const t = this.vp.scrollTop + this.vp.clientHeight * .35; let cur = 1;
    for (const s of this.sheets) { if (s.offsetTop <= t) cur = +s.dataset.n; else break; }
    if (cur !== this.page) { this.page = cur; this.ui(); }
  }

  /* ---------- UI ---------- */
  ui() {
    const g = (id) => $('#' + id), bk = this.mode === 'book';
    const label = { page: 'Satu halaman', scroll: 'Gulir', book: 'Mode buku' }[this.mode];
    g('bPage').textContent = (bk && this.page + 1 <= this.n ? `${this.page}–${this.page + 1}` : this.page) + ' / ' + this.n;
    g('bPrev').disabled = this.page <= 1;
    g('bNext').disabled = (bk ? this.page + 1 : this.page) >= this.n;
    g('bZoom').textContent = Math.round(this.zoom * 100) + '%';
    g('bZin').disabled = this.zoom >= 3; g('bZout').disabled = this.zoom <= .5;
    g('bMode').innerHTML = ic(this.mode === 'page' ? 'slide' : this.mode);
    g('bMode').title = `Mode: ${label} (M) — klik untuk ganti`;
    try { localStorage.setItem(this.key, this.page); } catch (e) {}
  }
  
  showTb() {
    this.tb.classList.remove('off');
    clearTimeout(this.hideT);
    this.hideT = setTimeout(() => { 
      if (!this.tb.matches(':hover')) this.tb.classList.add('off'); 
    }, TB_HIDE_MS);
  }
  toggleTb() { this.tb.classList.contains('off') ? this.showTb() : (clearTimeout(this.hideT), this.tb.classList.add('off')); }

  bind() {
    const g = (id) => $('#' + id), w = this.wrap;
    
    g('bPrev').onclick = () => this.prev(); g('bNext').onclick = () => this.next();
    g('bZin').onclick = () => this.zoomBy(.25); g('bZout').onclick = () => this.zoomBy(-.25); g('bZoom').onclick = () => this.setZoom(1);
    g('bMode').onclick = () => this.cycle();
    g('bPage').onclick = () => { const v = parseInt(prompt(`Ke halaman (1–${this.n}):`, this.page), 10); if (v) this.go(v); };
    this.tb.addEventListener('pointerenter', () => clearTimeout(this.hideT));
    this.tb.addEventListener('pointerleave', () => this.showTb());

    this.vp.addEventListener('scroll', () => {
      if (this.mode !== 'scroll' || this.sf) return;
      this.sf = requestAnimationFrame(() => { this.sf = 0; this.track(); });
    }, { passive: true });

    // Tampilkan toolbar hanya saat kursor menyentuh area bawah
    w.addEventListener('pointermove', (e) => {
      const r = w.getBoundingClientRect();
      if (e.clientY > r.bottom - TB_ZONE) this.showTb();
    }, { passive: true });

    // Scroll-wheel hanya untuk zoom (ctrl)
    w.addEventListener('wheel', (e) => {
      if (e.ctrlKey) { e.preventDefault(); return this.zoomBy(e.deltaY < 0 ? .25 : -.25); }
    }, { passive: false });

    document.addEventListener('keydown', (e) => {
      if (/INPUT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
      const k = e.key, sc = this.mode === 'scroll'; let h = true;
      switch (k) {
        case 'ArrowRight': this.next(); break;
        case 'ArrowLeft': this.prev(); break;
        case 'ArrowDown': case 'PageDown': case ' ':
          if (sc) { h = false; break; }
          (k === ' ' && e.shiftKey) ? this.prev() : this.next(); break;
        case 'ArrowUp': case 'PageUp': if (sc) { h = false; break; } this.prev(); break;
        case 'Home': this.go(1); break;
        case 'End': this.go(this.n); break;
        case '+': case '=': this.zoomBy(.25); break;
        case '-': this.zoomBy(-.25); break;
        case '0': this.setZoom(1); break;
        case 'm': case 'M': this.cycle(); break;
        case 'f': case 'F': this.app.toggleFs(); break;
        default: h = false;
      }
      if (h) { e.preventDefault(); this.showTb(); }
    });

    const rs = () => { clearTimeout(this.rt); this.rt = setTimeout(() => { this.layout(); this.repaint(); }, 120); };
    window.addEventListener('resize', rs);
    document.addEventListener('fullscreenchange', rs);
  }
}

/* ==========================================================
   APP
   ========================================================== */
class ViewerEngine {
  constructor() {
    this.params = new URLSearchParams(location.search);
    this.uuid = this.params.get('id');
    this.urls = [];
    this.dom = { loading: $('#vLoading'), text: $('#vLoadingText'), spinner: $('#vSpinner'), stage: $('#vStage'),
      frame: $('#vFrame'), media: $('#mediaContainer'), fsBtn: $('#fullscreenBtn') };
    window.addEventListener('beforeunload', () => this.urls.forEach(u => URL.revokeObjectURL(u)));
  }

  async init() {
    fillIcons();
    this.setupTheme(); this.setupFullscreen();
    if (!this.uuid) return this.showError('Parameter ID tidak ditemukan di URL.');
    this.dom.text.textContent = 'Memuat data media...';
    try {
      const res = await fetch(`${API_URL}?action=getitem&id=${encodeURIComponent(this.uuid)}`);
      if (!res.ok) throw new Error('HTTP Error ' + res.status);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Gagal memuat data');
      this.item = data.item;
      this.fileId = this.item.FileId || '';
      this.link = this.item.Link || '';
      this.format = this.detectFormat(this.item);
      document.title = (this.item.Judul || 'Media') + ' · Go-pedia';
      $('#vTitle').textContent = this.item.Judul || 'Media';
      this.renderFooter();
      this.dom.stage.hidden = false;
      $('#vFooter').hidden = false;
      switch (this.format) {
        case 'pdf': await this.initPdf(); return;
        case 'youtube': this.initYouTube(); break;
        case 'video': this.initVideo(); break;
        case 'audio': await this.initAudio(); break;
        default: this.initExternal();
      }
      this.ready();
    } catch (err) {
      console.error(err);
      this.showError('Gagal: ' + err.message);
    }
  }

  detectFormat(item) {
    const tipe = (item.Tipe || '').toLowerCase(), link = String(item.Link || '').trim();
    if (YT.test(link)) return 'youtube';
    if (tipe === 'video') return item.FileId ? 'video' : 'external';
    if (tipe === 'audio' && (item.FileId || link)) return 'audio';
    if (item.FileId) return 'pdf';
    return 'external';
  }

  ready() {
    this.dom.loading.style.opacity = '0';
    setTimeout(() => { this.dom.loading.style.display = 'none'; }, 300);
  }

  mount(html) { this.dom.media.innerHTML = html; this.dom.frame.classList.add('frame-media'); }

  async initPdf() {
    this.dom.frame.classList.add('frame-media');
    try {
      this.dom.text.textContent = 'Mengunduh dokumen...';
      await this.loadScript(PDFJS + 'pdf.min.js');
      pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
      const res = await fetch(`${API_URL}?action=getfile&id=${encodeURIComponent(this.fileId)}&format=pdf`);
      if (!res.ok) throw new Error('HTTP Error ' + res.status);
      const data = await res.json();
      if (!data.ok || !data.content || data.content.length < 100) throw new Error('Isi PDF kosong atau rusak.');
      this.dom.text.textContent = 'Memproses dokumen...';
      this.bytes = b64ToBytes(data.content);
      const pdf = await pdfjsLib.getDocument({ data: this.bytes.slice() }).promise;
      if (!pdf.numPages) throw new Error('Dokumen PDF kosong.');
      this.viewer = new PdfViewer(this, pdf, 'gp_pg_' + this.uuid);
      await this.viewer.start();
    } catch (err) {
      console.error('PDF.js gagal, pakai penampil bawaan:', err);
      this.initNativePdf(err);
    }
  }

  initNativePdf(cause) {
    $('#pdfToolbar').hidden = true;
    if (!this.bytes) return this.showError('Gagal memuat PDF: ' + cause.message);
    const url = URL.createObjectURL(new Blob([this.bytes], { type: 'application/pdf' }));
    this.urls.push(url);
    this.mount(`<embed src="${url}" type="application/pdf" style="width:100%;height:100%;border:0">`);
    this.ready();
  }

  initVideo() {
    this.mount(`<iframe src="https://drive.google.com/file/d/${encodeURIComponent(this.fileId)}/preview" allow="autoplay; encrypted-media; fullscreen" allowfullscreen referrerpolicy="no-referrer"></iframe>`);
  }

  initYouTube() {
    const vid = (this.link.match(YT) || [])[1] || '';
    this.mount(`<iframe src="https://www.youtube.com/embed/${encodeURIComponent(vid)}?rel=0&modestbranding=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`);
  }

  async initAudio() {
    const drive = `https://drive.google.com/file/d/${encodeURIComponent(this.fileId)}/view`;
    const card = (sub, body) => `<div class="audio-card"><div class="audio-cover">${ic('music')}</div>
      <div class="audio-title">${esc(this.item.Judul)}</div>${sub}${body}</div>`;
    try {
      const res = await fetch(`${API_URL}?action=getfile&id=${encodeURIComponent(this.fileId)}&format=audio`);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Gagal mengunduh audio');
      const url = URL.createObjectURL(new Blob([b64ToBytes(data.content)], { type: data.mimeType || 'audio/mpeg' }));
      this.urls.push(url);
      this.mount(card('<div class="audio-subtitle">Audio Pembelajaran</div>',
        `<audio controls preload="auto" src="${url}"></audio>
         <div style="margin-top:1.5rem;font-size:.75rem;color:var(--muted)">Tidak bisa memutar? <a href="${drive}" target="_blank" rel="noopener">Buka di Drive</a></div>`));
    } catch (err) {
      this.mount(card(`<div class="audio-subtitle" style="color:var(--rose-ink)">${esc(err.message)}</div>`,
        `<a href="${drive}" target="_blank" rel="noopener" class="btn-open-ext">Buka Audio di Google Drive</a>`));
    }
  }

  initExternal() {
    const url = safeUrl(this.link) || safeUrl(this.params.get('url'));
    if (!url) return this.showError('Tautan tidak ditemukan atau tidak valid (harus http/https).');
    this.mount(`<div class="external-card"><div class="external-icon">${ic('link')}</div>
      <h2>${esc(this.item.Judul)}</h2>
      <p>Media ini berupa tautan eksternal yang tidak dapat ditampilkan langsung di halaman ini.</p>
      <a class="btn-open-ext" href="${esc(url)}" target="_blank" rel="noopener">Buka Tautan</a></div>`);
  }

  renderFooter() {
    const name = (this.item.Pengunggah || '').split(' — ').pop() || 'Anonim';
    $('#vAuthor').innerHTML = `<span class="label">Pengunggah</span><span class="name">${esc(name)}</span>`;
    $('#vFooterActions').innerHTML = this.fileId
      ? `<a class="foot-btn" href="https://drive.google.com/file/d/${encodeURIComponent(this.fileId)}/view" target="_blank" rel="noopener"><i>${ic('ext')}</i><span>Buka Drive</span></a>` : '';
  }

  setupTheme() {
    const root = document.documentElement, saved = localStorage.getItem(THEME_KEY);
    root.dataset.theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    $('#btnTheme').addEventListener('click', () => {
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next; localStorage.setItem(THEME_KEY, next);
    });
  }

  toggleFs() {
    if (!document.fullscreenEnabled) return;
    document.fullscreenElement ? document.exitFullscreen() : this.dom.stage.requestFullscreen?.();
  }

  setupFullscreen() {
    if (!document.fullscreenEnabled) { this.dom.fsBtn.hidden = true; return; }
    this.dom.fsBtn.addEventListener('click', () => this.toggleFs());
    document.addEventListener('fullscreenchange', () => {
      this.dom.fsBtn.innerHTML = ic(document.fullscreenElement ? 'shrink' : 'expand');
    });
  }

  loadScript(src) {
    return new Promise((ok, fail) => {
      if (document.querySelector(`script[src="${src}"]`)) return ok();
      const s = document.createElement('script');
      s.src = src; s.onload = ok; s.onerror = () => fail(new Error('Gagal memuat script: ' + src));
      document.head.appendChild(s);
    });
  }

  showError(msg) {
    this.dom.loading.style.display = 'flex'; this.dom.loading.style.opacity = '1';
    this.dom.spinner.style.display = 'none';
    this.dom.text.textContent = msg; this.dom.text.classList.add('v-error-text');
  }
}

document.addEventListener('DOMContentLoaded', () => new ViewerEngine().init());
</script>
