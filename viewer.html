<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Viewer · Go-pedia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#faf8f5; --surface:#fff; --surface-2:#f5f2ec; --border:#ece7de;
  --text:#2e2e3f; --text-soft:#5a5a70; --muted:#8e8ea0;
  --primary:#8899c4; --primary-hover:#7386b5;
  --primary-soft:#edf0f8; --primary-ring:#dde4f2;
  --sage:#c8d9c8; --sage-ink:#4a5d4a;
  --lavender:#e0d7ee; --lav-ink:#5a4a6b;
  --butter:#f5ebc8; --butter-ink:#7a6b35;
  --rose:#f5cfd4; --rose-ink:#7a3a44;
  --shadow-md:0 6px 20px rgba(46,46,63,.08);
  --header-h:64px; --footer-h:56px;
}
[data-theme="dark"] {
  --bg:#1c1c28; --surface:#24242f; --surface-2:#2a2a38; --border:#35353f;
  --text:#eceaf2; --text-soft:#b8b6c8; --muted:#8e8ca0;
  --primary:#98a8d0; --primary-soft:#2e3245;
  --sage:#3a4a3a; --sage-ink:#a8d0a8;
  --lavender:#3a3248; --lav-ink:#c8b8e0;
  --butter:#4a4228; --butter-ink:#e8d8a0;
  --rose:#4a3238; --rose-ink:#e8b8c0;
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--text); line-height:1.5;
  -webkit-font-smoothing:antialiased; height:100vh; overflow:hidden;
  display:flex; flex-direction:column;
}
button { font:inherit; color:inherit; cursor:pointer; border:none; background:none; }
a { color:var(--primary); text-decoration:none; }
.hidden { display:none !important; }

/* HEADER */
.v-header {
  height:var(--header-h); flex-shrink:0;
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  padding:0 1rem; background:var(--surface);
  border-bottom:1px solid var(--border); z-index:20;
}
.v-brand { display:flex; align-items:center; gap:.6rem; min-width:0; flex:1; }
.v-brand-mark {
  width:36px; height:36px; border-radius:10px;
  background:var(--primary-soft); color:var(--primary);
  display:grid; place-items:center; flex-shrink:0;
}
.v-brand-mark svg { width:20px; height:20px; }
.v-title-wrap { min-width:0; flex:1; }
.v-title {
  font-size:.92rem; font-weight:700; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.2;
}
.v-subtitle {
  font-size:.7rem; color:var(--muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.v-actions { display:flex; gap:.4rem; flex-shrink:0; }
.btn-icon {
  width:36px; height:36px; border-radius:9px;
  display:inline-flex; align-items:center; justify-content:center;
  background:var(--surface-2); border:1px solid var(--border);
  color:var(--text-soft); transition:all .15s;
}
.btn-icon:hover:not(:disabled) { background:var(--primary-soft); color:var(--primary); border-color:var(--primary-ring); }
.btn-icon:disabled { opacity:.35; cursor:not-allowed; }
.btn-icon svg { width:16px; height:16px; }
.btn-back {
  display:inline-flex; align-items:center; gap:.4rem;
  padding:.5rem .85rem; border-radius:9px;
  background:var(--primary); color:#fff;
  font-size:.8rem; font-weight:700; transition:all .15s;
}
.btn-back:hover { background:var(--primary-hover); text-decoration:none; }
.btn-back svg { width:14px; height:14px; }

/* MAIN */
.v-main {
  flex:1; position:relative; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  padding:1rem; min-height:0; background:var(--bg);
}
.v-stage { width:100%; height:100%; max-width:1280px; display:flex; flex-direction:column; gap:.75rem; min-height:0; }

.v-toolbar { display:flex; align-items:center; justify-content:space-between; gap:.5rem; flex-shrink:0; }
.v-page-indicator {
  font-size:.74rem; font-weight:700; color:var(--text-soft);
  background:var(--surface); border:1px solid var(--border);
  padding:.3rem .7rem; border-radius:999px;
}
.v-progress-track { height:3px; border-radius:999px; background:var(--border); overflow:hidden; flex-shrink:0; }
.v-progress-fill { height:100%; width:0%; background:linear-gradient(90deg, var(--sage) 0%, var(--primary) 100%); transition:width .3s ease; }

.v-frame {
  flex:1; min-height:0; position:relative;
  background:var(--surface); border:1px solid var(--border);
  border-radius:16px; box-shadow:var(--shadow-md);
  display:flex; align-items:center; justify-content:center;
  padding:clamp(8px, 1.5vw, 20px); overflow:hidden;
}
.v-frame.frame-media { padding:0; background:#0a0a0f; }
.v-stage:fullscreen { max-width:100%; padding:12px; background:var(--bg); }
.v-stage:fullscreen .v-frame { border-radius:12px; }

/* FLIPBOOK */
.flip-book { display:none; box-shadow:none; width:100% !important; height:100% !important; }
.page { background:var(--surface); overflow:hidden; border:1px solid var(--border); width:100%; height:100%; }
.page img { width:100%; height:100%; object-fit:contain; display:block; border:none; background:#fff; }
.page-blank { background:transparent !important; border:none !important; }
.page-blank img { display:none !important; }

/* MEDIA MODES */
.media-stage {
  width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  background:#000; border-radius:16px; overflow:hidden;
}
.media-stage iframe, .media-stage video { width:100%; height:100%; border:0; object-fit:contain; display:block; background:#000; }

.audio-card {
  width:100%; max-width:520px; background:var(--surface); border:1px solid var(--border);
  border-radius:16px; padding:2rem 1.75rem; text-align:center; box-shadow:var(--shadow-md);
}
.audio-cover {
  width:160px; height:160px; margin:0 auto 1.5rem; border-radius:24px;
  background:linear-gradient(135deg, var(--lavender) 0%, var(--primary-soft) 100%);
  display:flex; align-items:center; justify-content:center;
  color:var(--lav-ink); box-shadow:0 10px 30px rgba(136,153,196,.25);
  animation:audio-pulse 2.4s ease-in-out infinite;
}
.audio-cover svg { width:64px; height:64px; }
@keyframes audio-pulse { 0%, 100% { transform:scale(1); } 50% { transform:scale(1.04); } }
.audio-title { font-size:1.15rem; font-weight:800; color:var(--text); margin-bottom:.35rem; line-height:1.3; }
.audio-subtitle { font-size:.8rem; color:var(--muted); margin-bottom:1.25rem; }
.audio-card audio { width:100%; margin-top:.5rem; outline:none; }

.external-card {
  width:100%; max-width:440px; background:var(--surface); border:1px solid var(--border);
  border-radius:16px; padding:2.25rem 1.75rem; text-align:center; box-shadow:var(--shadow-md);
}
.external-icon {
  width:80px; height:80px; border-radius:22px; background:var(--primary-soft);
  color:var(--primary); display:flex; align-items:center; justify-content:center; margin:0 auto 1.25rem;
}
.external-icon svg { width:36px; height:36px; }
.external-card h2 { font-size:1.1rem; font-weight:800; color:var(--text); margin-bottom:.5rem; line-height:1.3; }
.external-card p { font-size:.83rem; color:var(--text-soft); margin-bottom:1.5rem; line-height:1.6; }
.btn-open-ext {
  display:inline-flex; align-items:center; gap:.5rem; padding:.7rem 1.5rem; border-radius:10px;
  background:var(--primary); color:#fff; font-weight:700; font-size:.85rem; transition:all .15s;
}
.btn-open-ext:hover { background:var(--primary-hover); text-decoration:none; transform:translateY(-1px); }

body.mode-media .v-page-indicator,
body.mode-media .v-progress-track { display:none !important; }
body.mode-media .v-frame { padding:0; background:#0a0a0f; border-radius:12px; }
body.mode-media .v-toolbar { justify-content:flex-end; }

/* LOADING */
.v-loading {
  position:absolute; inset:0; background:var(--bg); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:1rem; z-index:15; padding:2rem; text-align:center; transition:opacity .3s;
}
.v-spinner { width:38px; height:38px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--primary); animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.v-loading-text { font-size:.85rem; font-weight:600; color:var(--text-soft); max-width:360px; }
.v-error-text { color:var(--rose-ink); }

/* FOOTER */
.v-footer {
  height:var(--footer-h); flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
  gap:1rem; padding:0 1rem; background:var(--surface); border-top:1px solid var(--border);
}
.v-author { display:flex; align-items:center; gap:.5rem; font-size:.8rem; color:var(--text-soft); min-width:0; }
.v-author .av { width:28px; height:28px; border-radius:50%; background:var(--butter); color:var(--butter-ink); display:grid; place-items:center; font-size:.68rem; font-weight:800; flex-shrink:0; }
.v-author .name { font-weight:700; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.v-footer-actions { display:flex; gap:.4rem; flex-shrink:0; }
.foot-btn { display:inline-flex; align-items:center; gap:.4rem; padding:.5rem .85rem; border-radius:9px; font-size:.8rem; font-weight:700; transition:all .15s; text-decoration:none; }
.foot-btn.primary { background:var(--primary); color:#fff; box-shadow:0 4px 12px -2px rgba(136,153,196,.4); }
.foot-btn.primary:hover { background:var(--primary-hover); text-decoration:none; }
.foot-btn.ghost { background:var(--surface-2); color:var(--text-soft); border:1px solid var(--border); }
.foot-btn.ghost:hover { background:var(--primary-soft); color:var(--primary); text-decoration:none; }
.foot-btn svg { width:13px; height:13px; }

.toast {
  position:fixed; bottom:calc(var(--footer-h) + 1rem); left:50%; transform:translateX(-50%) translateY(80px);
  background:var(--text); color:var(--bg); padding:.6rem 1rem; border-radius:10px;
  font-size:.8rem; font-weight:600; z-index:999; box-shadow:var(--shadow-md); max-width:90vw;
  transition:transform .3s; pointer-events:none;
}
.toast.show { transform:translateX(-50%) translateY(0); }

@media (max-width:640px) {
  :root { --header-h:56px; --footer-h:52px; }
  .v-main { padding:.5rem; }
  .v-title { font-size:.85rem; }
  .v-subtitle { display:none; }
  .btn-back span { display:none; }
  .btn-back { padding:.5rem; }
  .foot-btn span { display:none; }
  .foot-btn { padding:.5rem .6rem; }
  .audio-card { padding:1.5rem 1.25rem; }
  .audio-cover { width:130px; height:130px; }
  .audio-cover svg { width:52px; height:52px; }
}
</style>
</head>
<body>

<header class="v-header">
  <div class="v-brand">
    <div class="v-brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        <polygon points="10 8 16 11.5 10 15" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <div class="v-title-wrap">
      <div class="v-title" id="vTitle">Memuat...</div>
      <div class="v-subtitle" id="vSubtitle">Go-pedia · Pustaka Media</div>
    </div>
  </div>
  <div class="v-actions">
    <button class="btn-icon" id="btnTheme" title="Ganti tema">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>
    <a href="index.html" class="btn-back" title="Kembali ke katalog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
      </svg>
      <span>Katalog</span>
    </a>
  </div>
</header>

<main class="v-main">
  <div class="v-loading" id="vLoading">
    <div class="v-spinner" id="vSpinner"></div>
    <div class="v-loading-text" id="vLoadingText">Menyiapkan viewer...</div>
  </div>

  <div class="v-stage" id="vStage" hidden>
    <div class="v-toolbar" id="vToolbar">
      <span class="v-page-indicator" id="vPageIndicator" hidden>Hal. 1 / 1</span>
      <button class="btn-icon" id="downloadBtn" title="Unduh" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/>
        </svg>
      </button>
      <button class="btn-icon" id="fullscreenBtn" title="Layar penuh" hidden>
        <svg id="fullscreenIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
          <path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
        </svg>
      </button>
    </div>

    <div class="v-progress-track" id="vProgressTrack" hidden>
      <div class="v-progress-fill" id="vProgressFill"></div>
    </div>

    <div class="v-frame" id="vFrame">
      <div id="mediaContainer" hidden></div>
      <!-- FIX 3: bookZoomWrap punya ID agar bisa di-hide total -->
      <div id="bookZoomWrap" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;">
        <div id="book" class="flip-book"></div>
      </div>
    </div>
  </div>
</main>

<footer class="v-footer" id="vFooter" hidden>
  <div class="v-author" id="vAuthor"></div>
  <div class="v-footer-actions" id="vFooterActions"></div>
</footer>

<div class="toast" id="toast"></div>

<script>
'use strict';

const API_URL = 'https://script.google.com/macros/s/AKfycbzsCStKIS9V6qFNeGqhI1jhZLXbd-AmTFsF17SOCb8Gh0RoIZv6eiGK_PsTWHNomfXU/exec';
const THEME_KEY = 'gopedia_theme';
const $ = (s) => document.querySelector(s);

class ViewerEngine {
  constructor() {
    this.params = new URLSearchParams(location.search);
    this.uuid = this.params.get('id');
    this.format = '';
    this.item = null;
    this.fileId = '';
    this.link = '';
    
    this.pageFlip = null;
    this.pageElements = [];
    this.objectUrls = []; // Array penampung URL Blob
    
    this.dom = {
      vTitle: $('#vTitle'),
      vLoading: $('#vLoading'),
      vLoadingText: $('#vLoadingText'),
      vSpinner: $('#vSpinner'),
      vStage: $('#vStage'),
      vFrame: $('#vFrame'),
      vPageIndicator: $('#vPageIndicator'),
      vProgressTrack: $('#vProgressTrack'),
      vProgressFill: $('#vProgressFill'),
      downloadBtn: $('#downloadBtn'),
      fullscreenBtn: $('#fullscreenBtn'),
      fullscreenIcon: $('#fullscreenIcon'),
      bookZoomWrap: $('#bookZoomWrap'), // FIX 3: Ambil elemen pembungkus
      book: $('#book'),
      mediaContainer: $('#mediaContainer'),
      vFooter: $('#vFooter'),
      vAuthor: $('#vAuthor'),
      vFooterActions: $('#vFooterActions'),
    };
  }

  async init() {
    this.setupTheme();
    this.setupFullscreen();
    
    // FIX 5: Pindahkan listener download ke dalam class
    this.dom.downloadBtn.addEventListener('click', () => {
      if (this.fileId) {
        window.open(`https://drive.google.com/uc?export=download&id=${this.fileId}&confirm=t`, '_blank');
      }
    });

    // FIX 1: Bersihkan memori saat halaman ditutup / di-refresh
    window.addEventListener('beforeunload', () => this.cleanup());

    if (!this.uuid) {
      this.showError('Parameter ID tidak ditemukan di URL.');
      return;
    }

    this.dom.vLoadingText.textContent = 'Memuat data media...';
    
    try {
      // 1. Ambil data dari Sheet via API
      const res = await fetch(`${API_URL}?action=getitem&id=${encodeURIComponent(this.uuid)}`);
      
      // FIX 4: Cek HTTP Status sebelum parsing JSON
      if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
      
      const data = await res.json();
      if (!data.ok) throw new Error(typeof data.error === 'object' ? JSON.stringify(data.error) : (data.error || 'Gagal memuat data'));
      
      this.item = data.item;
      this.fileId = this.item.FileId || '';
      this.link = this.item.Link || '';
      this.format = this.detectFormat(this.item);
      
      document.title = this.item.Judul + ' · Go-pedia';
      this.dom.vTitle.textContent = this.item.Judul;
      this.dom.vFooter.hidden = false;
      
      this.renderFooter();
      this.dom.downloadBtn.hidden = !this.fileId;
      
      // 2. Render berdasarkan format
      switch (this.format) {
        case 'pdf':
          await this.initFlipbook();
          break;
        case 'youtube':
          this.initYouTube();
          break;
        case 'video':
          this.initVideo();
          break;
        case 'audio':
          this.initAudio();
          break;
        case 'external':
        default:
          this.initExternal();
          break;
      }
      
      this.dom.vLoading.style.opacity = '0';
      setTimeout(() => {
        this.dom.vLoading.style.display = 'none';
        this.dom.vStage.hidden = false;
      }, 300);
      
    } catch (err) {
      console.error(err);
      this.showError('Gagal: ' + err.message);
    }
  }

  detectFormat(item) {
    const tipe = (item.Tipe || '').toLowerCase();
    const link = String(item.Link || '').trim();
    
    if (/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/.test(link)) return 'youtube';
    if (tipe === 'video') {
      if (item.FileId) return 'video';
      if (link) return 'external';
    }
    if (tipe === 'audio') {
      if (item.FileId || link) return 'audio';
    }
    if (['ebook', 'lkpd', 'poster', 'dokumen'].includes(tipe)) {
      if (item.FileId) return 'pdf';
      if (link) return 'external';
    }
    if (item.FileId) return 'pdf';
    if (link) return 'external';
    return 'external';
  }

  /* ==========================================================
     FLIPBOOK (PDF)
     ========================================================== */
  async initFlipbook() {
    this.dom.vLoadingText.textContent = 'Mengunduh dokumen PDF...';
    
    await this.loadScript("https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js");
    await this.loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js");
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    this.dom.vPageIndicator.hidden = false;
    this.dom.vProgressTrack.hidden = false;

    try {
      const res = await fetch(`${API_URL}?action=getfile&id=${encodeURIComponent(this.fileId)}&format=pdf`);
      if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
      
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Gagal mendownload PDF');

      this.dom.vLoadingText.textContent = 'Merender halaman...';
      
      const binary = atob(data.content);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

      const pdf = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
      const total = pdf.numPages;
      const outputScale = Math.min(window.devicePixelRatio || 1, 2.0);
      const targetWidth = Math.round(Math.min(700, Math.max(320, window.innerWidth - 60)));

      const pageWrappers = new Array(total);
      let baseRatio = 0.72;

      // FIX 2: Batching render (4 halaman sekaligus) agar UI tidak freeze
      const BATCH_SIZE = 4;
      for (let i = 1; i <= total; i += BATCH_SIZE) {
        const batchPromises = [];
        for (let j = i; j < i + BATCH_SIZE && j <= total; j++) {
          batchPromises.push(this.renderPdfPage(pdf, j, targetWidth, outputScale).then(res => {
            if (j === 1) baseRatio = res.ratio;
            pageWrappers[j - 1] = res.wrapper;
            this.dom.vLoadingText.textContent = `Merender halaman ${j} / ${total}...`;
          }));
        }
        await Promise.all(batchPromises);
      }

      this.pageElements = pageWrappers;
      this.mountBook(baseRatio);
      
    } catch (err) {
      this.showError('Gagal memuat PDF: ' + err.message);
    }
  }

  async renderPdfPage(pdf, pageNum, targetWidth, outputScale) {
    const page = await pdf.getPage(pageNum);
    const native = page.getViewport({ scale: 1 });
    const renderScale = (targetWidth * outputScale) / native.width;
    const viewport = page.getViewport({ scale: renderScale });
    
    const canvas = document.createElement('canvas');
    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);
    const ctx = canvas.getContext('2d', { alpha: false });
    
    await page.render({ canvasContext: ctx, viewport }).promise;
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.92));
    const url = URL.createObjectURL(blob);
    this.objectUrls.push(url);
    
    const wrapper = document.createElement('div');
    wrapper.className = 'page';
    const img = document.createElement('img');
    img.src = url; 
    img.alt = 'Halaman ' + pageNum;
    wrapper.appendChild(img);

    return { wrapper, ratio: native.width / native.height };
  }

  mountBook(aspectRatio) {
    const fragment = document.createDocumentFragment();
    
    const blankStart = document.createElement('div');
    blankStart.className = 'page page-blank';
    fragment.appendChild(blankStart);
    
    this.pageElements.forEach(el => fragment.appendChild(el));
    
    if (this.pageElements.length % 2 === 1) {
      const blankEnd = document.createElement('div');
      blankEnd.className = 'page page-blank';
      fragment.appendChild(blankEnd);
    }
    
    this.dom.book.appendChild(fragment);
    this.dom.book.style.display = 'block';
    
    this.pageFlip = new window.St.PageFlip(this.dom.book, {
      width: 400,
      height: Math.round(400 / aspectRatio),
      size: 'stretch',
      minWidth: 200, maxWidth: 700,
      minHeight: 200, maxHeight: 9999,
      showCover: false, usePortrait: true,
      mobileScrollSupport: true,
      maxShadowOpacity: 0.3, drawShadow: true,
      flippingTime: 700
    });

    this.pageFlip.loadFromHTML(this.dom.book.querySelectorAll('.page'));

    const updateUI = (current) => {
      let actual = current < 1 ? 1 : current;
      this.dom.vPageIndicator.textContent = `Hal. ${actual} / ${this.pageElements.length}`;
      this.dom.vProgressFill.style.width = `${(actual / this.pageElements.length) * 100}%`;
    };
    updateUI(1);

    this.pageFlip.on('flip', (e) => updateUI(e.data));
  }

  /* ==========================================================
     MEDIA MODES
     ========================================================== */
  mountMedia(html) {
    document.body.classList.add('mode-media');
    
    // FIX 3: Sembunyikan seluruh kontainer buku, bukan hanya buku-nya
    this.dom.book.style.display = 'none';
    this.dom.bookZoomWrap.style.display = 'none'; 
    
    this.dom.mediaContainer.innerHTML = html;
    this.dom.mediaContainer.hidden = false;
    this.dom.vFrame.classList.add('frame-media');
  }

  initVideo() {
    const html = `
      <div class="media-stage">
        <iframe src="https://drive.google.com/file/d/${encodeURIComponent(this.fileId)}/preview"
                allow="autoplay; encrypted-media; fullscreen" allowfullscreen
                referrerpolicy="no-referrer"></iframe>
      </div>`;
    this.mountMedia(html);
  }

  initYouTube() {
    const match = this.link.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
    const vid = match ? match[1] : '';
    const html = `
      <div class="media-stage">
        <iframe src="https://www.youtube.com/embed/${encodeURIComponent(vid)}?rel=0&modestbranding=1"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
                allowfullscreen referrerpolicy="no-referrer"></iframe>
      </div>`;
    this.mountMedia(html);
    this.dom.downloadBtn.hidden = true;
  }

  initAudio() {
    const src = this.fileId 
      ? `https://drive.google.com/uc?export=download&id=${encodeURIComponent(this.fileId)}` 
      : this.link;
      
    const html = `
      <div class="audio-card">
        <div class="audio-cover">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
          </svg>
        </div>
        <div class="audio-title">${this.escapeHtml(this.item.Judul)}</div>
        <div class="audio-subtitle">Audio Pembelajaran</div>
        <audio controls preload="metadata" src="${src}"></audio>
        <div style="margin-top:1rem;font-size:.75rem;color:var(--muted);">
          Audio tidak diputar? <a href="${src}" target="_blank">Buka langsung</a>
        </div>
      </div>`;
    this.mountMedia(html);
  }

  initExternal() {
    const url = this.link || this.params.get('url');
    if (!url) {
      this.showError('Tautan tidak ditemukan.');
      return;
    }
    const html = `
      <div class="external-card">
        <div class="external-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
        </div>
        <h2>${this.escapeHtml(this.item.Judul)}</h2>
        <p>Media ini berupa tautan eksternal yang tidak dapat ditampilkan langsung di halaman ini.</p>
        <a class="btn-open-ext" href="${this.escapeHtml(url)}" target="_blank" rel="noopener">
          Buka Tautan
        </a>
      </div>`;
    this.mountMedia(html);
    this.dom.downloadBtn.hidden = true;
  }

  /* ==========================================================
     UTILS
     ========================================================== */
  renderFooter() {
    const name = (this.item.Pengunggah || '').split(' — ').pop() || 'Anonim';
    const initial = name.charAt(0).toUpperCase();
    this.dom.vAuthor.innerHTML = `
      <span class="av">${this.escapeHtml(initial)}</span>
      <div><div class="name">${this.escapeHtml(name)}</div></div>`;

    const actions = [];
    if (this.fileId) {
      actions.push(`<a class="foot-btn ghost" href="https://drive.google.com/file/d/${encodeURIComponent(this.fileId)}/view" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
        </svg><span>Buka Drive</span></a>`);
    }
    this.dom.vFooterActions.innerHTML = actions.join('');
  }

  setupTheme() {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved) document.documentElement.dataset.theme = saved;
    else if (matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.dataset.theme = 'dark';

    $('#btnTheme').addEventListener('click', () => {
      const cur = document.documentElement.dataset.theme;
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      localStorage.setItem(THEME_KEY, next);
    });
  }

  setupFullscreen() {
    if (!document.fullscreenEnabled) return;
    this.dom.fullscreenBtn.hidden = false;
    this.dom.fullscreenBtn.addEventListener('click', () => {
      const el = this.dom.vStage;
      if (!document.fullscreenElement) {
        el.requestFullscreen?.();
        this.dom.fullscreenIcon.innerHTML = '<path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>';
      } else {
        document.exitFullscreen?.();
        this.dom.fullscreenIcon.innerHTML = '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>';
      }
    });
  }

  loadScript(src) {
    return new Promise((resolve, reject) => {
      if (document.querySelector(`script[src="${src}"]`)) return resolve();
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error('Gagal memuat script: ' + src));
      document.head.appendChild(s);
    });
  }

  // FIX 1: Fungsi untuk membersihkan memori Blob URL
  cleanup() {
    this.objectUrls.forEach(url => URL.revokeObjectURL(url));
    this.objectUrls = [];
    if (this.pageFlip) {
      try { this.pageFlip.destroy(); } catch(_) {}
    }
  }

  escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  showError(msg) {
    this.dom.vSpinner.style.display = 'none';
    this.dom.vLoadingText.textContent = msg;
    this.dom.vLoadingText.classList.add('v-error-text');
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const viewer = new ViewerEngine();
  viewer.init();
});
</script>
</body>
</html>
